[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ouragentteams"
version = "0.2.0"
description = "Multi-agent orchestration with a local LLM Leader directing cloud/local Workers."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Aclitice", email = "aclitice20022020@163.com"},
]
keywords = [
    "llm", "agent", "multi-agent", "orchestration", "ollama",
    "litellm", "cli", "ai", "workflow",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "litellm>=1.40",
    "ollama>=0.2",
    "chromadb>=0.5",
    "typer>=0.12",
    "rich>=13",
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "tiktoken>=0.7",
    "sqlalchemy>=2",
    "pyyaml>=6",
    "aiofiles>=23",
    "croniter>=2.0",
    "python-dotenv>=1.0",
]

[project.urls]
Homepage = "https://github.com/Mythos-creator/ourAgentTeams"
Repository = "https://github.com/Mythos-creator/ourAgentTeams"
Issues = "https://github.com/Mythos-creator/ourAgentTeams/issues"

[project.scripts]
ouragentteams = "src.cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "eval*"]
exclude = ["tests*", "data*", "agents*", "config*"]

[tool.setuptools.package-data]
"src._templates" = ["*.tpl", "*.yaml", "*.md"]
"src._templates.agents" = ["*.md"]
